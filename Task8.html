<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 8</title>
</head>
<style>
    body{
        text-align: center;
        border: 100px,solid rgb(179, 55, 55);
        
    }
.dropdown {
    position: relative;
    display: inline-block;
}
.dropdown-button{
     background-color: rgb(13, 13, 210);
    color: white;
    padding: 12px 20px;
    border: 2px,solid rgb(51, 11, 172);
    cursor: pointer;
    font-size: 46px;
    padding: 100px;
    margin: 100px;

}
.dropdown-content{
    display: none;
    position: absolute;
    background-color: white;
    min-width: 160px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    z-index: 1;
}
.dropdown-content a {
    display: block;
    color: black;
    padding: 12px 16px;
    text-decoration: none;
}

.dropdown-content a:hover {
    background-color: blue;
    color: white;
}

.dropdown:hover .dropdown-content {
    display: block;
}

.dropbtn:hover {
    background-color: darkblue;
}
</style>
<body>
    <div class="dropdown">
        <button class="dropdown-button">Coursre</button>
        <div class="dropdown-content">
            <a href="#">HTML</a>
            <a href="#">CSS</a>
            <a href="#">JAVA SCRIPT</a>
        </div>
    </div>
</body>
</html>
