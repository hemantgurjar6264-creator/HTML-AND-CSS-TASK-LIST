
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 19 - Dark Mode</title>

    <style>
        :root {
            --bg-color: white;
            --text-color: black;
            --box-border: black;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: Arial, sans-serif;
            transition: background-color 0.3s, color 0.3s;
        }

        #theme-toggle {
            position: absolute;
            opacity: 0;
            width: 1px;
            height: 1px;
        }

        label {
            padding: 10px 20px;
            border-radius: 10px;
            background-color: antiquewhite;
            color: black;
            cursor: pointer;
            border: 1px solid #ccc;
        }

        label:hover {
            background-color: black;
            color: white;
        }

        #theme-toggle:focus-visible + label {
            outline: 2px solid royalblue;
            outline-offset: 3px;
        }

        .box {
            width: 300px;
            padding: 20px;
            border: 2px solid var(--box-border);
            border-radius: 10px;
            text-align: center;
            transition: background-color 0.3s, color 0.3s;
        }

        body:has(#theme-toggle:checked) {
            --bg-color: #222;
            --text-color: white;
            --box-border: white;
        }

        body:has(#theme-toggle:checked) .box {
            background-color: #333;
        }

        body:has(#theme-toggle:checked) label {
            background-color: #444;
            color: white;
            border-color: white;
        }
    </style>
</head>
<body>
    <input type="checkbox" id="theme-toggle">
    <label for="theme-toggle">Dark Mode</label>

    <div class="box">
        <h1>My Website</h1>
        <p>This is a simple dark mode website.</p>
    </div>
</body>
</html>
