<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 17</title>
</head>
<style>
    body{
            font-family: Arial;
            background-color: lightgray;
        }
        .timeline{
            width: 500px;
            margin: 50px;
            position: relative;
        }
        .timeline::before{
            content: "";
            position: absolute;
            width: 4px;
            top: 0;
             bottom: 0;
            background-color: blue;
            left: 10px;
        }
        .event{
            background-color: white;
            margin: 20px;
            padding: 15px;
            border-radius: 10px;
            position: relative;
        }
        .event::after{
             content: "";
            width: 15px;
            height: 15px;
            background-color: blue;
            border-radius: 50%;
            position: absolute;
            left: -17px;
            top: 20px
        }
        .event:hover{
         background-color: antiquewhite;
        }


        
</style>
<body>
    <div class="timeline">
        <div class="event">
            <h2>2023</h2>
            <p>Started College</p>
        </div>

        <div class="event">
            <h2>2024</h2>
            <p>Learned HTML and CSS</p>
        </div>

        <div class="event">
            <h2>2025</h2>
            <p>Learned java and python</p>
        </div>

        <div class="event">
            <h2>2026</h2>
            <p>start a web devlopment</p>
        </div>
    </div>
</body>
</html>
