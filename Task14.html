<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 14</title>
</head>
<style>
    *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .dashboard{
            display: grid;
            grid-template-columns: 200px 1fr;
            grid-template-rows: 90px 1fr;
            height: 100vh;
        }
    .header{
        background-color: blue;
            color: white;
            grid-column: 1 / 3;
            display: flex;
            align-items: center;
            padding: 20px;
    
    }
    .sidebar{
        color: white;
        background-color: #000;
        padding: 20px;
        }
        .sidebar h2{
            margin-bottom: 40px;
        }

        .sidebar p{
            margin: 20px 0;
        }
        .content{
            background-color: #f2f2f2;
            padding: 30px;
        }
        .cards{
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 40px;
        }
        .card{
             background-color: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 10px 4px 8px gray;
        }
        .card h2{
            margin-bottom: 25px;
        }
        .card:hover{
            background-color: wheat;
        }

</style>
<body>
    <div class="dashboard">

    <header class="header">
        <h1>My Dashboard</h1>
    </header>

    <aside class="sidebar">
        <h2>Menu</h2>
        <p>Dashboard</p>
        <p>Users</p>
        <p>Products</p>
        <p>Settings</p>
    </aside>

    <main class="content">

        <h1>Dashboard</h1>

        <div class="cards">
            <div class="card">
         <h2>Users</h2>
          <p>₹1200</p>
        </div>

        <div class="card">
            <h2>Orders</h2>
            <p>₹450</p>
        </div>
    

        <div class="card">
            <h2>Sales</h2>
            <p>₹50,000</p>
        </div>
        </div>
    </main>
    </div>
</body>
</html>
