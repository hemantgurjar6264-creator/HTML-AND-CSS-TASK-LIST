<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 4 - Accessible Navbar</title>
</head>
<body>

    <header>
        <nav aria-label="Main Navigation">
            <img src="image/apple logo.png" alt="Apple logo" width="20" height="20">

            <a href="#home">Home</a>
            <a href="#about">About</a>
            <a href="#service">Service</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <main>
        <section id="home">
            <h1>Home</h1>
            <p>Welcome to my website.</p>
        </section>

        <section id="about">
            <h2>About</h2>
            <p>Learn more about us.</p>
        </section>

        <section id="service">
            <h2>Services</h2>
            <p>Explore our services.</p>
        </section>

        <section id="contact">
            <h2>Contact</h2>
            <p>Contact us for more information.</p>
        </section>
    </main>

</body>
</html>
